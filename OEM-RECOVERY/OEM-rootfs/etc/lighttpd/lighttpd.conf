server.document-root = "/tmp/www"

server.max-request-size = 65536

#server.use-ipv6 = "enable"

server.port = 80
server.tag = ""
server.errorlog = "/tmp/lighttpd.error.log"

server.modules = (
    "mod_rewrite",
    "mod_access",
    "mod_redirect",
    "mod_proxy",
    "mod_openssl",
)

server.indexfiles = (
    "index.php",
    "index.html",
    "index.htm",
    "default.htm",
)

#[AP-700] use lighttpd as proxy to handle requests from obuspa to improve performance
$SERVER["socket"] == "127.0.0.1:8081" {
    proxy.server = (
        "" => (
            (
                "host" => "::1",
                "port" => 8080
            )
        )
    )
}

$SERVER["socket"] == ":443" {
    ssl.engine = "enable"
    ssl.pemfile = "/etc/lighttpd.pem"
#	ssl.openssl.ssl-conf-cmd = ("MaxProtocol" => "TLSv1.2") -- enable when upgrade to a higher version of lighttpd to limit TLS version to 1.2
    proxy.server = (
        "" => (
            (
                "host" => "::1",
                "port" => 8080
            )
        )
    )
}

$HTTP["scheme"] == "http" {
    $HTTP["remote-ip"] != "127.0.0.1" {
        $HTTP["host"] =~ "^[^:]*" {
            url.redirect = (".*" => "https://%0:443$0")
        }
    }
}

