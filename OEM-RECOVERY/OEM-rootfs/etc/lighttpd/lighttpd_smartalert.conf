server.document-root = "/tmp/www"

server.max-request-size = 65536

#server.use-ipv6 = "enable"

server.port = 8083
server.tag = ""
server.errorlog = "/tmp/lighttpd.error.log"

server.modules = (
    "mod_rewrite",
    "mod_access",
    "mod_redirect",
    "mod_proxy",
    "mod_openssl",
)

server.indexfiles = (
    "index.php",
    "index.html",
    "index.htm",
    "default.htm",
)

$SERVER["socket"] == ":8084" {
    ssl.engine = "enable"
    ssl.pemfile = "/etc/lighttpd.pem"
    #ssl.openssl.ssl-conf-cmd = ("MaxProtocol" => "TLSv1.2")

    proxy.server = (
        "" => (
            (
                "host" => "127.0.0.1",
                "port" => 8080
            )
        )
    )
}

proxy.server = (
    "" => (  
        (
            "host" => "127.0.0.1",
            "port" => 8080
        )
    )
)
#server.bind = "192.168.1.1"

$HTTP["scheme"] == "http" {
    $HTTP["url"] != "/cgi-bin/luci/smartalert" {
        $HTTP["url"] !~ "luci-static" {
            $HTTP["remote-ip"] != "127.0.0.1" {
                $HTTP["host"] =~ "^[^:]*" {
                    url.redirect = (".*" => "/cgi-bin/luci/smartalert")
                }
            }
        }
    }
}


$HTTP["scheme"] == "https" {
    $HTTP["url"] != "/cgi-bin/luci/smartalert" {
        $HTTP["url"] !~ "luci-static" {
            $HTTP["remote-ip"] != "127.0.0.1" {
                $HTTP["host"] =~ "^[^:]*" {
                    url.redirect = (".*" => "/cgi-bin/luci/smartalert")
                }
            }
        }
    }
}
url.redirect-code = 302

