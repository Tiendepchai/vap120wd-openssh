<script src="/luci-static/resources/monCon.js"></script>
<script type="text/javascript" src="<%=resource%>/cbi.js?v=git-17.250.41546-90ac861"></script>
<script type="text/javascript">
    var network_uci_cfg;
    var iface_uci_cfg;
    var iface6_uci_cfg;
    var ifc = "<%=iface%>";
    function update_other_binding(cur_ifc, nwcfg)
    {
        for (let s in nwcfg)
        {
            if ("binding" in nwcfg[s])
            {
                if (s != cur_ifc)
                {
                    if (nwcfg[s].binding.indexOf("eth0.1") !== -1)
                    {
                        $("[id='conn_binding_1']").prop("disabled", true)
                        $("[id='conn_binding_1']").prop("checked", true)
                    }
                    if (nwcfg[s].binding.indexOf("eth0.2") !== -1)
                    {
                        $("[id='conn_binding_2']").prop("disabled", true)
                        $("[id='conn_binding_2']").prop("checked", true)
                    }
                }
            }
        }
    }
    function update_ip_cfg()
    {
        var cur_proto = $("[id='conn_proto']").val();
        var is_ip6_enable = $("[id='conn_ip6']").is(':checked');
        if (cur_proto == "static")
        {
            $("#static_ipv4_config").show();
            if (is_ip6_enable)
                $("#static_ipv6_config").show();
            else
                $("#static_ipv6_config").hide();
            $("#pppoe_config").hide();
            $("#auto_ipv6_config").hide();
        }
        else if (cur_proto == "dhcp")
        {
            if (is_ip6_enable)
                // $("#auto_ipv6_config").show();
                $("#auto_ipv6_config").hide();
            else
                $("#auto_ipv6_config").hide();
            $("#static_ipv4_config").hide();
            $("#static_ipv6_config").hide();
            $("#pppoe_config").hide();
        }
        else if (cur_proto == "pppoe")
        {
            $("#pppoe_config").show();
            if (is_ip6_enable)
                // $("#auto_ipv6_config").show();
                $("#auto_ipv6_config").hide();
            else
                $("#auto_ipv6_config").hide();
            $("#static_ipv4_config").hide();
            $("#static_ipv6_config").hide();
        }
        $("#conn_binding_div").hide();
        $("#conn_ip6_div").show();
        $("#conn_defroute_div").show();
        $("#conn_proto_div").show();
    }

    function show_bridge_cfg()
    {
        $("#conn_binding_div").show();
        $("#pppoe_config").hide();
        $("#static_ipv4_config").hide();
        $("#static_ipv6_config").hide();
        $("#auto_ipv6_config").hide();
        $("#conn_proto_div").hide();
        $("#conn_defroute_div").hide();
        $("#conn_ip6_div").hide();
    }
    function conn_type_onchange()
    {
        var cur_type = $("[id='conn_type']").val();
        if (cur_type == "bridge")
        {
            show_bridge_cfg();
        }
        else if (cur_type == "route")
        {
            update_ip_cfg();
        }
    }
    function validate_vlanid()
    {
        var iface_vlanid = $("[id='conn_vlan']").val();
        if (iface_vlanid.length == 0){
            iface_vlanid = "0";
        }
        else if ( iface_vlanid < 1 || iface_vlanid > 4094){
            window.alert("VLAN ID must be in the range 1-4094")   
            return false;
        }

        for (let x in network_uci_cfg)
        {
            if ("_vlanid" in network_uci_cfg[x] && network_uci_cfg[x][".name"] != ifc)
            {
                if (iface_vlanid == network_uci_cfg[x]["_vlanid"])
                {
                    window.alert("Duplicated VLAN ID")
                    return false;
                }
            }
        }
        return true;
    }
    function validate_static_cfg()
    {
        var alert_msg = "You have entered an invalid: ";
        var is_ip6_enable = $("[id='conn_ip6']").is(':checked');
        var is_valid_all = true;
        //init values
        var is_valid = {};
        is_valid.ipv4_addr = false;
        is_valid.ipv4_mask = false;
        is_valid.ipv4_dns = true;
        is_valid.ipv4_gw = true;

        var cfg_param = {};
        cfg_param.static_ipv4_addr  = $("[id='static_ipv4_addr']").val();
        cfg_param.static_ipv4_mask = $("[id='static_ipv4_mask']").val();
        cfg_param.static_ipv4_dns  = $("[id='static_ipv4_dns']").val();
        cfg_param.static_ipv4_gw = $("[id='static_ipv4_gw']").val();

        if(is_ip6_enable == true)
        {
            is_valid.ipv6_addr = false;
            is_valid.ipv6_prefix = false;
            is_valid.ipv6_dns = true;
            is_valid.ipv6_gw = true;

            cfg_param.static_ipv6_ip6addr  = $("[id='static_ipv6_ip6addr']").val();
            cfg_param.static_ipv6_ip6prefix = $("[id='static_ipv6_ip6prefix']").val();
            cfg_param.static_ipv6_dns6  = $("[id='static_ipv6_dns6']").val();
            cfg_param.static_ipv6_ip6gw = $("[id='static_ipv6_ip6gw']").val();
        }

        //validation
        var ipv4_addr_format = /^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$/;
        var ipv4_mask_format = /^(((255\.){3}(255|254|252|248|240|224|192|128|0+))|((255\.){2}(255|254|252|248|240|224|192|128|0+)\.0)|((255\.)(255|254|252|248|240|224|192|128|0+)(\.0+){2})|((255|254|252|248|240|224|192|128|0+)(\.0+){3}))$/;
        var ipv6_addr_format = /(([0-9a-fA-F]{1,4}:){7,7}[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,7}:|([0-9a-fA-F]{1,4}:){1,6}:[0-9a-fA-F]{1,4}|([0-9a-fA-F]{1,4}:){1,5}(:[0-9a-fA-F]{1,4}){1,2}|([0-9a-fA-F]{1,4}:){1,4}(:[0-9a-fA-F]{1,4}){1,3}|([0-9a-fA-F]{1,4}:){1,3}(:[0-9a-fA-F]{1,4}){1,4}|([0-9a-fA-F]{1,4}:){1,2}(:[0-9a-fA-F]{1,4}){1,5}|[0-9a-fA-F]{1,4}:((:[0-9a-fA-F]{1,4}){1,6})|:((:[0-9a-fA-F]{1,4}){1,7}|:)|fe80:(:[0-9a-fA-F]{0,4}){0,4}%[0-9a-zA-Z]{1,}|::(ffff(:0{1,4}){0,1}:){0,1}((25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])\.){3,3}(25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])|([0-9a-fA-F]{1,4}:){1,4}:((25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9])\.){3,3}(25[0-5]|(2[0-4]|1{0,1}[0-9]){0,1}[0-9]))/;
        if( cfg_param.static_ipv4_addr.match(ipv4_addr_format))
        {
            is_valid.ipv4_addr = true;
        }
        if( cfg_param.static_ipv4_mask.match(ipv4_mask_format))
        {
            is_valid.ipv4_mask = true;
        }
        if( cfg_param.static_ipv4_dns && cfg_param.static_ipv4_dns.match(ipv4_addr_format) == null)
        {
            is_valid.ipv4_dns = false;
        }

        if(cfg_param.static_ipv4_gw && cfg_param.static_ipv4_gw.match(ipv4_addr_format) == null)
        {
            is_valid.ipv4_gw = false;
        }
        
        if(is_ip6_enable == true)
        {
            if( cfg_param.static_ipv6_ip6addr.match(ipv6_addr_format))
                {
                    is_valid.ipv6_addr = true;
                }
            if( cfg_param.static_ipv6_dns6 && cfg_param.static_ipv6_dns6.match(ipv6_addr_format) == null)
                {
                    is_valid.ipv6_dns = false;
                }

            if(cfg_param.static_ipv6_ip6gw && cfg_param.static_ipv6_ip6gw.match(ipv6_addr_format) == null)
                {
                    is_valid.ipv6_gw = false;
                }  
            if(cfg_param.static_ipv6_ip6prefix >= 1 && cfg_param.static_ipv6_ip6prefix <= 128)
            {
                is_valid.ipv6_prefix = true;
            }
        }
        
        for (var key in is_valid)
        {
            if(is_valid[key] == false)
            {
                is_valid_all = false;
                break;
            }
        }
        if(is_valid_all == true)
        {
            return true;
        }
        else{
            if(is_valid.ipv4_addr == false)
            {
                alert_msg += "\n\tIPv4 address"
            }
            if(is_valid.ipv4_mask == false)
            {
                alert_msg += "\n\tSubnet mask"
            }
            if(is_valid.ipv4_dns == false)
            {
                alert_msg += "\n\tIPv4 DNS"
            }
            if(is_valid.ipv4_gw == false)
            {
                alert_msg += "\n\tIPv4 Gateway"
            }
            
            if(is_valid.ipv6_addr == false)
            {
                alert_msg += "\n\tIPv6 address"
            }
            if(is_valid.ipv6_prefix == false)
            {
                alert_msg += "\n\tIPv6 routed prefix"
            }
            if(is_valid.ipv6_dns == false)
            {
                alert_msg += "\n\tIPv6 DNS servers"
            }
            if(is_valid.ipv6_gw == false)
            {
                alert_msg += "\n\tIPv6 gateway"
            }            
            window.alert(alert_msg);
            return false;
        }
    }
    
    function validate_pppoe_cfg()
    {
        pppoe_usrname  = $("[id='pppoe_usrname']").val();
        pppoe_pwd = $("[id='pppoe_pwd']").val();
        if(!pppoe_usrname && !pppoe_pwd)
        {
            window.alert("Username and Password cannot be empty!");
            return false;
        }
        else if(!pppoe_usrname)
        {
            window.alert("Username cannot be empty!");
            return false;
        }
        else if(!pppoe_pwd)
        {
            window.alert("Password cannot be empty!");
            return false;
        }
        return true;
    }
    function validate_dfroute()
    {
        var uci_dfroute = network_uci_cfg.globals.wan_df_route;
        var request_dfroute_cfg = $("[id='conn_defroute']").is(":checked");
        var request_type_cfg = $("[id='conn_type']").val();

        if (uci_dfroute == ifc)
        {
            if (false == request_dfroute_cfg || "bridge" == request_type_cfg)
            {
                window.alert("There must be one default route interface. \nYou can't change this interface type to bridge or disable default route but set another interface to default route");
                return false;
            }
        }
        else
        {
            if (true == request_dfroute_cfg && "route" == request_type_cfg)
            {
                let confirm_msg = "Another interface is set as default route.\nDo you want to change default route?"
                if (true == confirm(confirm_msg))
                {
                    return true;
                }
                else
                {
                    return false;
                }
            }
        }

        return true;
    }

    function validate_form()
    {
        var cur_proto = $("[id='conn_proto']").val();
        if (false == validate_vlanid())
            return false;
        if (false == validate_dfroute())
            return false;
        if (cur_proto == "static" && false == validate_static_cfg())
            return false;
        else if( cur_proto == "pppoe" && false == validate_pppoe_cfg())
            return false;
        console.log("true");
        return true;
    }

    function handle_get_data(x)
    {
        network_uci_cfg = JSON.parse(x.response);
        if (ifc + "_ip6" in network_uci_cfg)
        {
            iface6_uci_cfg = network_uci_cfg[ifc + "_ip6"];
        }
        if (ifc != "add")
        {
            iface_uci_cfg = network_uci_cfg[ifc];

            $("[id='conn_name']").val(iface_uci_cfg._conn_name); 

            if ("type" in iface_uci_cfg)
            { 
                if (iface_uci_cfg.type == "bridge")
                    $("[id='conn_type']").val("bridge"); 
            }
            else
            {
                $("[id='conn_type']").val("route"); 
            }

            if ("_service" in iface_uci_cfg)
                $("[id='conn_serv']").val(iface_uci_cfg._service); 

            if ("_vlanid" in iface_uci_cfg)
            {
                if (parseInt(iface_uci_cfg._vlanid) > 0)
                    $("[id='conn_vlan']").val(iface_uci_cfg._vlanid); 
            }
            else return false;

            if ("proto" in iface_uci_cfg)
                $("[id='conn_proto']").val(iface_uci_cfg.proto);

            if ("binding" in iface_uci_cfg)
            {
                if (iface_uci_cfg.binding.indexOf("eth0.1") != -1)
                {
                    $("[id='conn_binding_1']").prop("checked", true)
                }
                else
                {
                    $("[id='conn_binding_1']").prop("checked", false)
                }
                if (iface_uci_cfg.binding.indexOf("eth0.2") != -1)
                {
                    $("[id='conn_binding_2']").prop("checked", true)
                }
                else
                {
                    $("[id='conn_binding_2']").prop("checked", false)
                }
            }

            if ("defaultroute" in iface_uci_cfg)
            {   
                if (iface_uci_cfg.defaultroute == "1")
                    $("[id='conn_defroute']").prop("checked", true)
            }

            if ("ipv6" in iface_uci_cfg)
            {   
                if (iface_uci_cfg.ipv6 == "auto" || iface_uci_cfg.ipv6 == "1")
                    $("[id='conn_ip6']").prop("checked", true)
                else if (iface_uci_cfg.ipv6 == "0")
                    $("[id='conn_ip6']").prop("checked", false)
            }

            if ("username" in iface_uci_cfg)
            {   
                $("[id='pppoe_usrname']").val(iface_uci_cfg.username)
            }
            if ("password" in iface_uci_cfg)
            {   
                $("[id='pppoe_pwd']").val(iface_uci_cfg.password)
            }

            if ("ipaddr" in iface_uci_cfg)
            {   
                $("[id='static_ipv4_addr']").val(iface_uci_cfg.ipaddr)
            }
            if ("netmask" in iface_uci_cfg)
            {   
                $("[id='static_ipv4_mask']").val(iface_uci_cfg.netmask)
            }
            if ("dns" in iface_uci_cfg)
            {   
                $("[id='static_ipv4_dns']").val(iface_uci_cfg.dns)
            }
            if ("gateway" in iface_uci_cfg)
            {   
                $("[id='static_ipv4_gw']").val(iface_uci_cfg.gateway)
            }

            if (iface6_uci_cfg)
            {
                if ("ip6addr" in iface6_uci_cfg)
                {   
                    $("[id='static_ipv6_ip6addr']").val(iface6_uci_cfg.ip6addr)
                }
                if ("ip6prefix" in iface6_uci_cfg)
                {   
                    $("[id='static_ipv6_ip6prefix']").val(iface6_uci_cfg.ip6prefix)
                }
                if ("dns" in iface6_uci_cfg)
                {   
                    $("[id='static_ipv6_dns6']").val(iface6_uci_cfg.dns)
                }
                if ("ip6gw" in iface6_uci_cfg)
                {   
                    $("[id='static_ipv6_ip6gw']").val(iface6_uci_cfg.ip6gw)
                }
                if ("reqprefix" in iface6_uci_cfg)
                {   
                    if (iface6_uci_cfg.reqprefix == "auto")
                        $("[id='auto_ipv6_reqprefix']").prop("checked", true)
                    else if (iface6_uci_cfg.reqprefix == "no")
                        $("[id='auto_ipv6_reqprefix']").prop("checked", false)
                }
                if ("reqaddress" in iface6_uci_cfg)
                {   
                    $("[id='auto_ipv6_reqaddress']").val(iface6_uci_cfg.reqaddress)
                }
            }
        }
        return true;
    }

    function call_xhr_poll()
    {
        console.log("call xhr poll");
        XHR.poll(2, '<%=luci.dispatcher.build_url("admin/network/ifc_uci_cfg")%>', null,
            function(x)
            {
                console.log(x);
                try {
                    if (handle_get_data(x))
                    {
                        XHR.halt();
                        console.log("call xhr.halt to cancel polling");
                        $("[id='apply-button']").prop("disabled", false);
                        conn_type_onchange();
                        update_other_binding(ifc, network_uci_cfg);
                    }
                }
                catch (e) {
                    console.log(e);
                    console.log("Something wrong");
                }
            }
        );
    }

    window.onload = function () {
        //AP-504
        if (window.location.href.indexOf("stok") > 0)
        setupTimers();

        $("[id='apply-button']").prop("disabled", true);
        conn_type_onchange();
        call_xhr_poll();
    }
</script>

<form method="post" name="wan_form" class="form-inline" action="<%=luci.dispatcher.build_url("admin/network/wan_apply", iface)%>" onsubmit="return validate_form()" autocomplete="off">
    <div class="widget col-xs-12 col-lg-12 mb-5"> 
        <legend><h2>WAN Configuration</h2></legend>
        <div class="d-flex flex-wrap widget-body">
            <fieldset class="col-lg-12 mb-3">
                <div class="form-group mb-3" id="conn_name_div">
                    <label  class="col-lg-4" for="conn_name">Connection name</label>
                    <input type="text" id="conn_name" name="conn_name" value="VIETTEL">
                </div>

                <div class="form-group mb-3" id="conn_type_div">
                    <label class="col-lg-4" for="conn_type" >Type</label>
                    <select name="conn_type" id="conn_type" class="form-select" onchange="conn_type_onchange()">
                        <option value="bridge">Bridge</option>
                        <option value="route" selected>Route</option>
                    </select>
                </div>

                <div class="form-group mb-3" id="conn_serv_div">
                    <label  class="col-lg-4" for="conn_serv" >Service Type</label>
                    <select name="conn_serv" id="conn_serv" class="form-select">
                        <option value="internet" selected>Internet</option>
                        <option value="iptv">IPTV</option>
                    </select>
                </div>

                <div class="form-group mb-3" id="conn_vlan_div">
                    <label  class="col-lg-4" for="conn_vlan" >VLAN ID</label>
                    <input type="number" id="conn_vlan" name="conn_vlan" >
                </div>
                
                <div class="form-group mb-3" id="conn_proto_div">
                    <label  class="col-lg-4" for="conn_proto" >Protocol</label>
                    <select name="conn_proto" id="conn_proto" class="form-select" onchange="update_ip_cfg()">
                        <option value="dhcp" selected>DHCP</option>
                        <option value="static">Static</option>
                        <option value="pppoe">PPPoE</option>
                    </select>
                </div>

                <div class="form-group mb-3" id="conn_binding_div">
                    <label  class="col-lg-4" for="conn_binding" >Port binding</label>
                    <!-- <div class="cbi-value-field">
                        <ul name="conn_binding" id="conn_binding" style="list-style-type: none;">
                            <li>
                                <input type="checkbox" id="conn_binding_1" name="conn_binding_1" class="cbi-input-checkbox"> LAN 1<br><br>
                            </li>
                            <li>
                                <input type="checkbox" id="conn_binding_2" name="conn_binding_2" class="cbi-input-checkbox"> LAN 2<br><br>
                            </li>
                        </ul>
                    </div> -->
                    <div class="form-check col-lg-2 justify-content-start" >
                        <input type="checkbox" id="conn_binding_1" name="conn_binding_1" class="form-check-input" >
                        <label class="form-check-label" for="conn_binding_1" style="margin-left: 20px;" >LAN 1</label>
                    </div>

                    <div class="form-check col-lg-2 justify-content-start">
                        <input type="checkbox" id="conn_binding_2" name="conn_binding_2" class="form-check-input">
                        <label class="form-check-label" for="conn_binding_2" style="margin-left: 20px;">LAN 2</label>
                    </div>
                    
                </div>

                <div class="form-group mb-3" id="conn_defroute_div">
                    <label  class="col-lg-4" for="conn_defroute" >Default route</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="conn_defroute" name="conn_defroute">
                        <span class="slider"></span>
                    </label>
                </div>

                <div class="form-group mb-3" id="conn_ip6_div">
                    <label  class="col-lg-4" for="conn_ip6" >Enable IPv6</label>
                    <label class="toggle-switch">
                        <input type="checkbox" id="conn_ip6" name="conn_ip6" onchange="update_ip_cfg()" checked>
                        <span class="slider"></span>
                    </label>
                </div>

                <!-- PPPoE config -->
                <div name="pppoe_config" id="pppoe_config">
                    <h4>PPPoE Config</h4>

                    <div class="form-group mb-3">
                        <label  class="col-lg-4" for="pppoe_usrname" >Username</label>
                        <input type="text" id="pppoe_usrname" name="pppoe_usrname" ><br><br>
                    </div>

                    <div class="form-group mb-3">
                        <label  class="col-lg-4"  for="pppoe_pwd" >Password</label>
                        <input type="password" id="pppoe_pwd" name="pppoe_pwd"><br><br>
                    </div>
                </div>
                <!-- End PPPoE config -->

                <!-- Static IPv4 config -->
                <div name="static_ipv4_config" id="static_ipv4_config">
                    <h4>Static IPv4 config</h4>

                    <div class="form-group mb-3">
                        <label  class="col-lg-4"  for="static_ipv4_addr" >IPv4 Address</label>
                        <input type="text" id="static_ipv4_addr" name="static_ipv4_addr" ><br><br>
                    </div>

                    <div class="form-group mb-3">
                        <label  class="col-lg-4" for="static_ipv4_mask" >Subnet mask</label>
                        <input type="text" id="static_ipv4_mask" name="static_ipv4_mask" ><br><br>
                    </div>

                    <div class="form-group mb-3">
                        <label  class="col-lg-4" for="static_ipv4_dns" >IPv4 DNS</label>
                        <input type="text" id="static_ipv4_dns" name="static_ipv4_dns" ><br><br>
                    </div>

                    <div class="form-group mb-3">
                        <label  class="col-lg-4" for="static_ipv4_gw" >IPv4 Gateway</label>
                        <input type="text" id="static_ipv4_gw" name="static_ipv4_gw" ><br><br>
                    </div>

                </div>
                <!-- End Static IPv4 config -->

                <!-- Auto IPv6 config -->
                <div name="auto_ipv6_config" id="auto_ipv6_config" style="display: none;">
                    <h4>IPv6 config</h4>

                    <div class="form-group mb-3">
                        <label  class="col-lg-4" for="auto_ipv6_reqprefix" >Request PD</label>
                        <input type="checkbox" id="auto_ipv6_reqprefix" name="auto_ipv6_reqprefix" checked><br><br>
                    </div>

                    <div class="form-group mb-3">
                        <label  class="col-lg-4" for="auto_ipv6_reqaddress" >IPv6 acquire mode</label>
                        <select name="auto_ipv6_reqaddress" id="auto_ipv6_reqaddress" class="form-select">
                            <option value="try">DHCPv6</option>
                            <option value="none" selected>SLAAC</option>
                        </select>
                    </div>
        
                </div>
                <!-- End Auto IPv6 config -->

                <!-- Static IPv6 config -->
                <div name="static_ipv6_config" id="static_ipv6_config">
                    <h4>Static IPv6 config</h4>

                    <div class="form-group mb-3">
                        <label  class="col-lg-4" for="static_ipv6_ip6addr" >IPv6 address</label>
                        <input type="text" id="static_ipv6_ip6addr" name="static_ipv6_ip6addr" ><br><br>
                    </div>
                    <div class="form-group mb-3">
                        <label  class="col-lg-4" for="static_ipv6_ip6gw" >IPv6 gateway</label>
                        <input type="text" id="static_ipv6_ip6gw" name="static_ipv6_ip6gw" ><br><br>
                    </div>
                    <div class="form-group mb-3">
                        <label  class="col-lg-4" for="static_ipv6_ip6prefix" >IPv6 routed prefix</label>
                        <input type="text" id="static_ipv6_ip6prefix" name="static_ipv6_ip6prefix" ><br><br>
                    </div>
                    <div class="form-group mb-3">
                        <label  class="col-lg-4" for="static_ipv6_dns6" >Use custom DNS servers</label>
                        <input type="text" id="static_ipv6_dns6" name="static_ipv6_dns6" ><br><br>
                    </div>

                </div>
                <!-- End Static IPv6 config -->
            </fieldset>
        </div>
