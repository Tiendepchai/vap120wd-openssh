<%+header%>

<script src="/luci-static/resources/monCon.js"></script>

<div class="alert-message">
    <h2><a id="content" name="content"><%:Port Forwarding Disable%></a></h2>
    <p>Please disable firewall to use port forwarding feature</p>
    <!-- <big><strong>Please enable firewall to use port forwarding feature!</strong></big> -->
</div>
<fieldset class="cbi-section">    
    <button class="cbi-button" onclick="location.href='<%=luci.dispatcher.build_url("admin", "app", "firewall")%>'" title="Go to Firewall Page">
        <span><%_Go to Firewall Page%></span>
    </button>
    <button class="cbi-button"  onclick="location.href='<%=luci.dispatcher.build_url("admin", "app", "portforward")%>'" title="Reload this network">
        <em class="fas form-btn-reload"></em>
        <span><%_Reload%></span>
    </button>
</fieldset>

<%+footer%>
