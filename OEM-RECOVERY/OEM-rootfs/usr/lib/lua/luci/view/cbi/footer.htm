<%- if pageaction then -%>
<div class="cbi-page-actions" style="padding-top: 0">
    <% if redirect then %>
    <div style="float:left">
        <span class="form-btn form-btn-back"><input class="cbi-button" type="button" value="<%:Back to Overview%>" onclick="location.href='<%=pcdata(redirect)%>'" /></span>
    </div>
    <% end %>

    <% if flow.skip then %>
        <span class="form-btn form-btn-skip"><input class="cbi-button cbi-button-skip" type="submit" name="cbi.skip" value="<%:Skip%>" /></span>
    <% end %>
    <% if not autoapply and not flow.hideapplybtn then %>
        <input class="cbi-button cbi-button-apply" type="submit" name="cbi.apply" value="<%:Apply%>" />
    <% end %>

    <% if flow.downloadbtn then %>
    <script>
        function download() {
            window.location.href = "<%=luci.dispatcher.build_url("admin", "system", "syslog_download")%>"
        }
    </script>
    <input class="cbi-button cbi-button-apply" type="button" name="cbi.download_log" value="<%:Download%>" onclick="return download()"/>
    <% end %>
    <!-- <% if not flow.hidesavebtn then %>
        <input class="cbi-button cbi-button-save" type="submit" value="<%:Save%>" />
    <% end %> -->
    <% if not flow.hideresetbtn then %>
        <input class="cbi-button cbi-button-reset" type="button" value="<%:Reset%>" onclick="location.href='<%=REQUEST_URI%>'" />
    <% end %>

    <script type="text/javascript">cbi_d_update();</script>
</div>
<%- end -%>
</form>
<%+footer%>
